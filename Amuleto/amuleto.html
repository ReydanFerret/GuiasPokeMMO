<!DOCTYPE html>
<html lang="es">
<head>
	<!-- Google tag (gtag.js) -->
	<script async src="https://www.googletagmanager.com/gtag/js?id=G-J593KCQEKE"></script>
	<script>
	  window.dataLayer = window.dataLayer || [];
	  function gtag(){dataLayer.push(arguments);}
	  gtag('js', new Date());

	  gtag('config', 'G-J593KCQEKE');
	</script>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="ie=edge">
	<meta name="description" content="Herramienta para determinar el mejor encanto para cualquier ruta de gimnasios/entrenadores/alto mando.">
	<link rel="icon" href="./amulet.png" type="image/x-icon">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css">
	<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="styles.css">
	<title>SnowOld · Calculadora de Encantos PokeMMO</title>
</head>
<body>

<h1 class="titulo-principal"><span class="pokebola"></span>Calculadora de Encantos</h1>
<div class="clan">❄ Clan SnowOld ❄</div>

<div class="float-contianer">

<div id="calc" class="float-child">
<div class="row">
	<form id="charm-form">
	<h2>Costo del Encanto</h2>
		<label>Moneda Amuleto:</label><input class="form-control" type="text" id="amulet-coin-in" value="17000"><br>
		<label>Riquezas 75%:</label><input class="form-control" type="text" id="riches-75-in" value="65000"><br>
		<label>Riquezas 100%:</label><input class="form-control" type="text" id="riches-100-in" value="140000"><br>
		<div class="form-check form-switch">
			<input class="form-check-input" type="checkbox" id="donator">
			<label class="form-check-label" for="donator">Donador 5%</label>
		</div>
	</form>
</div>
<div class="row">
	<h2>Totales</h2>
	<h3 id="no-charm">Sin encanto: </h3>
	<h3 id="amulet-coin">Moneda Amuleto: </h3>
	<h3 id="riches-75">Riquezas 75%: </h3>
	<h3 id="riches-100">Riquezas 100%: </h3>
</div>
<hr>
<div class="row">
	<div class="form-group">
		<label for="link">Enlace a esta ruta:</label>
		<textarea class="form-control" id="link" readonly></textarea>
	</div>
</div>
<div class="row">
	<br><p>hecho por caav (ign) / c4v (discord) / <a href="https://github.com/c4vv/CharmCalc">repo original</a><br>traducido y con estética de hielo para el Clan SnowOld</p>
</div>
</div>

<div id="data" class="float-child">
<div class="row">
	<h2>Gimnasios</h2>
	<div id="gyms">
	</div>
</div>
<div class="row">
	<h2>Entrenadores</h2>
	<div id="trainers">
	</div>
</div>
<div class="row">
	<h2>Alto Mando</h2>
	<div id="elite-four">
	</div>
</div>
</div>

</div>
<script src="script.js"></script>
</body>
</html>
